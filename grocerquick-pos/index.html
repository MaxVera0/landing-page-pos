<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GrocerQuick POS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="login-card">
    <header>
        <img src="pos-icon.svg" class="icon" alt="POS Icon">
        <h1>GrocerQuick POS</h1>
        <p>Acceso al Sistema de Punto de Venta</p>
    </header>

    <form>
        <div class="input-group">
        <label for="username">USER ID / MATRÍCULA</label>
        <div class="input-wrapper">
            <img src="user-icon.svg" class="input-icon" alt="ID Icon">
            <input type="text" id="username" placeholder="Ingrese su matrícula">
        </div>
        </div>

        <div class="input-group">
        <label for="password">CONTRASEÑA</label>
        <div class="input-wrapper">
            <img src="lock-icon.svg" class="input-icon" alt="Lock Icon">
            <input type="password" id="password" placeholder="••••••••">
            <img src="eye-icon.svg" class="eye-icon" alt="View Password Icon">
        </div>
        </div>

        <button type="submit" class="submit-btn">Ingresar</button>
    </form>

    <footer>
        <hr>
        <p>Soporte Técnico: Ext. 4021</p>
        <p>Terminal ID: T-01A</p>
    </footer>
    </div>
    </body>
</html>
